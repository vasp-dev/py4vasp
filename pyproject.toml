[project]
name = "py4vasp-core"
dynamic = ["version"]
description = "Tool for assisting with the analysis and setup of VASP calculations."
authors = [
    { name = "VASP Software GmbH", email = "py4vasp@vasp.at" },
    { name = "Martin Schlipf", email = "martin.schlipf@gmail.com" },
    { name = "Henrique Miranda", email = "miranda.henrique@gmail.com" },
    { name = "Orest Dubay", email = "orest-d@users.noreply.github.com" },
    { name = "Jonathan Lahnsteiner", email = "jonathan.lahnsteiner@gmx.at" },
    { name = "Eisuke Kawashima", email = "e-kwsm@users.noreply.github.com" },
    { name = "Sudarshan Vijay", email = "sudarshan.vijay@protonmail.com" },
    { name = "Marie-Therese Huebsch", email = "marie-therese.huebsch@vasp.at" },
    { name = "Michael Wolloch", email = "michael.wolloch@vasp.at" },
    { name = "Andreas Singraber", email = "andreas.singraber@vasp.at" },
    { name = "Alexey Tal", email = "alexey.tal@vasp.at" },
    { name = "Tomáš Bučko", email = "tomas.bucko@uniba.sk" },
    { name = "Max Liebetreu", email = "max.liebetreu@vasp.at" },
]
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
dependencies = [
    "numpy>=2.0",
    "h5py>=3.11.0",
]

# py4vasp accesses every dependency beyond numpy and h5py through the lazy proxies in
# py4vasp._util.import_, so installing an extra afterwards is enough to enable the
# corresponding feature. `all` reproduces the dependencies of the `py4vasp` distribution;
# `sphinx` and `mdtraj` are deliberately not part of it.
[project.optional-dependencies]
plot = [
    "pandas>=2.2.2",
    "plotly>=5.23",
    "kaleido>=1.0",
]
structure = [
    "ase>=3.23",
    "seekpath>=2.1",
    "spglib>=2.5",
]
view = [
    "nglview>=3.0.5",
    "ase>=3.23",
]
interactive = [
    "ipython>=8.26",
]
numeric = [
    "scipy>=1.15.0",
]
cli = [
    "click>=8.1.8",
]
sphinx = [
    "sphinx>=8.0",
    "docutils>=0.20",
    "jinja2>=3.1",
]
mdtraj = [
    "mdtraj>=1.10",
]
all = [
    "py4vasp-core[plot,structure,view,interactive,numeric,cli]",
]

[project.urls]
Homepage = "https://vasp.at/py4vasp/latest"
Repository = "https://github.com/vasp-dev/py4vasp"
"Support Forum" = "https://vasp.at/forum/"

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.79",
]
dev = [
    "pylint>=3.0",
    "black>=23.7",
    "isort>=5.13",
    "ipykernel>=6.25.0",
    "pre-commit>=3.3.3",
]
doc = [
    # Repeats the floor of the `sphinx` extra: without it sphinx would only be pulled
    # in transitively by sphinx-automodapi, which accepts far older versions.
    "sphinx>=8.0",
    "sphinx-automodapi>=0.16",
]

[tool.uv]
default-groups = [
    "test",
    "dev",
    "doc",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/py4vasp/__init__.py"

# The distribution name does not match the import package, so hatchling cannot guess
# what to ship. The sdist would otherwise sweep in docs/, packages/ and dist/.
[tool.hatch.build.targets.wheel]
packages = ["src/py4vasp"]

[tool.hatch.build.targets.sdist]
include = ["/src/py4vasp", "/tests"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages"]

[tool.isort]
profile = "black"

[tool.black]
target-version = ["py311"]
