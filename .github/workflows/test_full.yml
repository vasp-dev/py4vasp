name: test-full

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Reused by publish.yml so a release runs exactly the same checks.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: test-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-full:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v5
    - name: Set up conda
      uses: conda-incubator/setup-miniconda@v3
      with:
        auto-update-conda: true
        python-version: ${{ matrix.python-version }}
        channels: conda-forge
        channel-priority: strict
        conda-remove-defaults: "true"
    - name: Set up uv
      shell: bash -el {0}
      run: |
        conda install -q conda-forge::uv
        uv --version
    # The whole workspace: py4vasp-core with every extra, plus the py4vasp wrapper and
    # vasp-backend. mdtraj is excluded here and installed by conda below, because
    # installing it with pip is unreliable.
    - name: Install the workspace
      shell: bash -el {0}
      run: |
        export VIRTUAL_ENV=$CONDA_PREFIX
        uv sync --active --all-packages --all-extras --no-extra mdtraj
    - name: Install mdtraj with conda
      shell: bash -el {0}
      run: |
        conda info
        conda install -q conda-forge::mdtraj
    - name: Test with pytest
      shell: bash -el {0}
      run: |
        export VIRTUAL_ENV=$CONDA_PREFIX
        uv run --active pytest --version
        uv run --active pytest --cov=py4vasp --cov=vasp --cov-report term
    - name: Check code style
      shell: bash -el {0}
      run: |
        export VIRTUAL_ENV=$CONDA_PREFIX
        uv run --active isort --version
        uv run --active isort --check src tests packages scripts
        uv run --active black --version
        uv run --active black --check src tests packages scripts
