name: test-minimal

# Verify that the minimum dependency versions declared in pyproject.toml actually
# install and pass the test suite. Uses uv's `lowest-direct` resolution to pin every
# direct dependency to its lowest declared version (transitive deps resolve normally)
# on the oldest supported Python. If this job fails, a declared lower bound is too low
# and should be raised (see https://scientific-python.org/specs/spec-0000/ for guidance).
#
# Resolution targets py4vasp-core with all its extras: those are where the third-party
# bounds live. The py4vasp wrapper only pins py4vasp-core, so it has no bounds to check.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 2 * * 6"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-minimal:
    runs-on: ubuntu-latest

    # Set for the whole job, not just `uv lock`: `uv sync` and `uv run` re-resolve
    # the lockfile as well, so a resolution passed only to `uv lock` gets discarded
    # again before the tests ever run.
    env:
      UV_RESOLUTION: lowest-direct

    steps:
    - uses: actions/checkout@v5
    - name: Install uv and set the Python version
      uses: astral-sh/setup-uv@v7
      with:
        python-version: "3.11"
    - name: Install py4vasp with lowest-direct dependency versions
      run: |
        uv --version
        python --version
        uv lock
        uv sync --package py4vasp-core --all-extras --no-extra mdtraj --no-default-groups --group test
        uv version
    - name: Test with pytest
      run: |
        uv run --no-sync pytest --version
        uv run --no-sync pytest
